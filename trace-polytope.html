<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace Polytope Gallery | NIEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <script src="js/nav.js"></script>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="manifest" href="images/manifest.json">
    <meta name="theme-color" content="#0a0f1d">
</head>
<body style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">
    <!-- REAL Top Navigation Bar -->
    <!-- Top Navigation Component -->
    <hub-nav></hub-nav>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <h2>Trace Polytope Gallery</h2>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search vertices (e.g. a0 a1)...">
                </div>
                <div class="filters-container">
                    <select id="filterType">
                        <option value="All">All Types</option>
                        <option value="SNIEP">SNIEP</option>
                        <option value="RNIEP">RNIEP</option>
                    </select>
                    <select id="filterSize">
                        <option value="All">All Sizes</option>
                        <option value="4">Size 4</option>
                        <option value="5">Size 5</option>
                        <option value="6">Size 6</option>
                    </select>
                    <select id="filterDim">
                        <option value="All">All Dims</option>
                        <option value="Polygon">2D Polygon</option>
                        <option value="Polyhedron">3D Polyhedron</option>
                    </select>
                </div>
            </div>
            <div class="plot-list" id="plotList">
                <!-- Plot items will be injected here via JS -->
            </div>
        </aside>
        
        <!-- Main Stage -->
        <main class="stage">
            <div id="welcomeMessage" class="glass welcome-msg">
                <h3>Select a plot from the sidebar</h3>
                <p>Use the search bar to filter by trace polytope vertices.</p>
            </div>
            <iframe id="plotFrame" class="plot-frame hidden" src="" frameborder="0"></iframe>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
