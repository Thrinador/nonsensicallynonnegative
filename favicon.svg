<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="60%" stop-color="#090d1a" />
            <stop offset="100%" stop-color="#030712" />
        </radialGradient>

        <!-- Region Fill Gradient -->
        <linearGradient id="regionGrad" x1="5%" y1="50%" x2="95%" y2="50%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.88" />
            <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.88" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95" />
        </linearGradient>

        <!-- Region Ambient Glow -->
        <radialGradient id="centerGlow" cx="45%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
        </radialGradient>

        <!-- Glow Filters -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="14" result="blur" />
        </filter>
        <filter id="strokeGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="perronGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- App Icon Squircle Background -->
    <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="4" />

    <!-- Ambient Center Light -->
    <circle cx="256" cy="256" r="220" fill="url(#centerGlow)" />

    <!-- Subtle Coordinate Crosshairs -->
    <line x1="54" y1="256" x2="458" y2="256" stroke="#475569" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 6" />
    <line x1="256" y1="54" x2="256" y2="458" stroke="#475569" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 6" />

    <!-- Unit Circle Guideline -->
    <circle cx="256" cy="256" r="182" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="6 6" />

