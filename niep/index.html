<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=../index.html">
    <link rel="canonical" href="../index.html">
    <title>Redirecting to NIEP Research Hub...</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme.js"></script>
    <style>
        .redirect-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .redirect-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 520px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }
        .redirect-card h1 {
            font-size: 1.5rem;
            margin: 0 0 1rem;
            color: var(--text-primary);
        }
        .redirect-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }
        .redirect-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .redirect-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
    </style>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/manifest.json">
    <meta name="theme-color" content="#0a0f1d">
</head>
<body class="hub-page">
    <div class="redirect-stage">
        <div class="redirect-card">
            <h1>Page Relocated</h1>
            <p>This content has moved to <strong>NIEP Research Hub</strong>. If you are not redirected automatically, please click below.</p>
            <a href="../index.html" class="redirect-btn">
                <span>Continue to NIEP Research Hub &rarr;</span>
            </a>
        </div>
    </div>
    <script>
        window.location.replace("../index.html");
    </script>
</body>
</html>
