<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Plot Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/niep/style.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem;
            max-width: 600px;
        }
        .error-container h1 {
            font-size: 6rem;
            margin: 0;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-container h2 {
            font-size: 2rem;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .error-container p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .back-btn {
            padding: 12px 24px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="stage" style="width: 100%;">
            <div class="error-container glass">
                <h1>404</h1>
                <h2>Plot Not Found</h2>
                <p>The trace polytope or page you are looking for doesn't exist. It might have been moved, deleted, or you might have entered the wrong URL.</p>
                <a href="/niep/" class="back-btn">Return to Gallery</a>
            </div>
        </div>
    </div>
</body>
</html>
