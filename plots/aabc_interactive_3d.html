            function applyStandardTheme(mode) {
                const isLight = (mode || localStorage.getItem('niep_theme') || 'light') === 'light';
                const gd = document.getElementById("plotly-3d-main");
                if (!gd || !gd.data) return;

                document.body.setAttribute('data-plot-theme', isLight ? 'light' : 'dark');
                document.body.style.backgroundColor = isLight ? '#ffffff' : '#0e1d33';
                document.body.style.color = isLight ? '#15370d' : '#eaf2ff';

                const d8Shades = isLight ? ['#2563eb', '#1d4ed8', '#3b82f6'] : ['#38bdf8', '#0284c7', '#7dd3fc'];
                const s4Shades = isLight ? ['#d97706', '#b45309', '#f59e0b', '#92400e', '#eab308', '#ca8a04', '#f97316'] : ['#f59e0b', '#d97706', '#fbbf24', '#f97316', '#fde047', '#eab308', '#fb923c'];
                const a5Shades = isLight ? ['#7c3aed', '#6d28d9', '#8b5cf6', '#5b21b6', '#9333ea', '#4c1d95', '#a855f7'] : ['#a855f7', '#9333ea', '#c084fc', '#7e22ce', '#d8b4fe', '#8b5cf6', '#e9d5ff'];
                const v4Color = isLight ? '#0d9488' : '#2dd4bf';
                const v4Edge = isLight ? '#0f766e' : '#14b8a6';
                const chamberColor = isLight ? '#64748b' : '#6e8eb8';
                const chamberEdge = isLight ? '#475569' : '#8ab4f8';
                const vertexColor = isLight ? '#15370d' : '#eaf2ff';
                const trace0Color = isLight ? '#15803d' : '#10b981';
                const diagColor = isLight ? '#b91c1c' : '#f43f5e';

                let d8Idx = 0, s4Idx = 0, a5Idx = 0;
                gd.data.forEach((tr) => {
                    if (tr.legendgroup === 'chamber') {
                        if (tr.type === 'mesh3d') tr.color = chamberColor;
                        if (tr.line) tr.line.color = chamberEdge;
                    } else if (tr.legendgroup === 'vertices') {
                        if (tr.marker) tr.marker.color = vertexColor;
                        if (tr.textfont) tr.textfont.color = vertexColor;
                    } else if (tr.legendgroup === 'v4') {
                        if (tr.type === 'mesh3d') tr.color = v4Color;
                        if (tr.line) tr.line.color = v4Edge;
                    } else if (tr.legendgroup === 'd8') {
                        const c = d8Shades[Math.floor(d8Idx / 2) % d8Shades.length];
                        if (tr.type === 'mesh3d') tr.color = c;
                        if (tr.line) tr.line.color = c;
                        d8Idx++;
                    } else if (tr.legendgroup === 's4') {
                        const c = s4Shades[Math.floor(s4Idx / 2) % s4Shades.length];
                        if (tr.type === 'mesh3d') tr.color = c;
                        if (tr.line) tr.line.color = c;
                        s4Idx++;
                    } else if (tr.legendgroup === 'a5') {
                        const c = a5Shades[Math.floor(a5Idx / 2) % a5Shades.length];
                        if (tr.type === 'mesh3d') tr.color = c;
                        if (tr.line) tr.line.color = c;
                        a5Idx++;
                    } else if (tr.name && tr.name.indexOf('Trace-Zero') !== -1) {
                        tr.color = trace0Color;
                    } else if (tr.name && (tr.name.indexOf('Diagonal') !== -1 || tr.name.indexOf('K1') !== -1)) {
                        if (tr.type === 'mesh3d') tr.color = diagColor;
                        if (tr.marker) tr.marker.color = diagColor;
                        if (tr.textfont) tr.textfont.color = diagColor;
                    }
                });

                const axisStyle = {
                    backgroundcolor: isLight ? '#fdfcf9' : '#081221',
                    gridcolor: isLight ? '#e8e2d2' : '#152946',
                    zerolinecolor: isLight ? '#728e6d' : '#213b61',
                    color: isLight ? '#15370d' : '#eaf2ff',
                    showbackground: true
                };

                const subColor = isLight ? '#536e4e' : '#a9c1e2';
                Plotly.relayout(gd, {
                    paper_bgcolor: isLight ? '#ffffff' : '#0e1d33',
                    plot_bgcolor: isLight ? '#fdfcf9' : '#081221',
                    'font.color': isLight ? '#15370d' : '#eaf2ff',
                    'title.font.color': isLight ? '#15370d' : '#eaf2ff',
                    'title.text': "<b>Interactive 3D Character Cones in the SNIEP: Spectrum (1, a, a, b, c)</b><br><span style='font-size:12px; color:" + subColor + ";'>Chamber 1 ≥ a ≥ b ≥ c ≥ -1, Tr(A) = 1 + 2a + b + c ≥ 0 | Rotate, zoom, and toggle group orbits</span>",
                    'scene.xaxis.backgroundcolor': axisStyle.backgroundcolor,
                    'scene.xaxis.gridcolor': axisStyle.gridcolor,
                    'scene.xaxis.zerolinecolor': axisStyle.zerolinecolor,
                    'scene.xaxis.color': axisStyle.color,
                    'scene.yaxis.backgroundcolor': axisStyle.backgroundcolor,
                    'scene.yaxis.gridcolor': axisStyle.gridcolor,
                    'scene.yaxis.zerolinecolor': axisStyle.zerolinecolor,
                    'scene.yaxis.color': axisStyle.color,
                    'scene.zaxis.backgroundcolor': axisStyle.backgroundcolor,
                    'scene.zaxis.gridcolor': axisStyle.gridcolor,
                    'scene.zaxis.zerolinecolor': axisStyle.zerolinecolor,
                    'scene.zaxis.color': axisStyle.color,
                    'legend.bgcolor': isLight ? 'rgba(255, 255, 255, 0.92)' : 'rgba(14, 29, 51, 0.90)',
                    'legend.bordercolor': isLight ? '#e5dfce' : '#213b61',
                    'legend.font.color': isLight ? '#15370d' : '#eaf2ff',
                    'updatemenus[0].bgcolor': isLight ? '#f4f0e4' : '#152946',
                    'updatemenus[0].bordercolor': isLight ? '#dcd4c0' : '#213b61',
                    'updatemenus[0].font.color': isLight ? '#15370d' : '#eaf2ff',
                    'updatemenus[1].bgcolor': isLight ? '#f4f0e4' : '#152946',
                    'updatemenus[1].bordercolor': isLight ? '#dcd4c0' : '#213b61',
                    'updatemenus[1].font.color': isLight ? '#15370d' : '#eaf2ff'
                });
                Plotly.redraw(gd);
            }

            applyStandardTheme();
            window.addEventListener('storage', (e) => {
                if (e.key === 'niep_theme') applyStandardTheme(e.newValue);
            });
            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'niep_theme_change') applyStandardTheme(e.data.theme);
            });
        }
    </script>
