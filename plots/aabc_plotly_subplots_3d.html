                const subColor = isLight ? '#536e4e' : '#a9c1e2';

                const updateObj = {
                    paper_bgcolor: isLight ? '#ffffff' : '#0e1d33',
                    plot_bgcolor: bg,
                    'font.color': txt,
                    'title.font.color': txt,
                    'title.text': "<b>Side-by-Side 3D Plotly Dashboard: Group Character Cones in the SNIEP</b><br><span style='font-size:12px; color:" + subColor + ";'>Comparing D8, S4, A5, and Adjoined V4 (+) [1] inside the Ordered Trace Polytope</span>",
                    'legend.font.color': txt
                };

                ['scene', 'scene2', 'scene3', 'scene4'].forEach(sc => {
                    ['xaxis', 'yaxis', 'zaxis'].forEach(ax => {
                        updateObj[sc + '.' + ax + '.backgroundcolor'] = bg;
                        updateObj[sc + '.' + ax + '.gridcolor'] = grid;
                        updateObj[sc + '.' + ax + '.zerolinecolor'] = zero;
                        updateObj[sc + '.' + ax + '.color'] = txt;
                        updateObj[sc + '.' + ax + '.showbackground'] = true;
                    });
                });

                if (gd.layout && gd.layout.annotations) {
                    gd.layout.annotations.forEach((ann, i) => {
                        updateObj['annotations[' + i + '].font.color'] = txt;
                    });
                }

                Plotly.relayout(gd, updateObj);
                Plotly.redraw(gd);
            }

            applySubplotsStandardTheme();
            window.addEventListener('storage', (e) => {
                if (e.key === 'niep_theme') applySubplotsStandardTheme(e.newValue);
            });
            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'niep_theme_change') applySubplotsStandardTheme(e.data.theme);
            });
        }
    </script>
</body>
</html>
